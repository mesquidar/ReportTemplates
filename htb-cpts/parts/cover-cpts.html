<div class="cover-page">
        <!-- Circuit pattern decoration (top) -->
        <div class="cover-decoration-top">
            <svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="neon-glow-top" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur5"/>
                        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur10"/>
                        <feMerge>
                            <feMergeNode in="blur10"/>
                            <feMergeNode in="blur5"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <g stroke="#A247DE" stroke-width="2" fill="none" stroke-linecap="square" filter="url(#neon-glow-top)">

                    <circle cx="20" cy="150" r="3" fill="#A247DE"/>
                    <circle cx="150" cy="20" r="3" fill="#A247DE"/>
                    <circle cx="220" cy="80" r="3" fill="#A247DE"/>
                    <circle cx="80" cy="220" r="3" fill="#A247DE"/>
                    <circle cx="180" cy="180" r="5" fill="#111927" stroke-width="2"/> <path d="M0,40 L60,40 L100,80 L180,80 L220,120 L220,250"/>

                    <path d="M60,40 L60,0"/>
                    <path d="M100,80 L100,120 L140,120 L180,160 L180,175"/>
                    <path d="M180,185 L180,220 L250,220"/>
                    <path d="M220,80 L280,80"/>
                    <path d="M220,120 L260,120 L260,100"/>
                    <path d="M80,220 L80,180 L40,180 L40,150 L23,150"/>
                    <path d="M150,23 L150,50 L120,80"/>

                    <rect x="250" y="40" width="10" height="10" stroke-width="1" fill="#111927"/>
                    <path d="M255,50 L255,70"/>
                    <path d="M250,45 L230,45"/>
                </g>
            </svg>

        </div>

        <!-- Main cover content -->
        <div class="cover-content">
            <!-- HTB Logo Section -->
            <div class="cover-logo-section">
                <div class="cover-logo-container">
                    <img src="assets/htb-logo-cover.png" alt="HTB Logo" />
                </div>
                <div class="cover-brand">
                    <span class="brand-text"></span>
                    <span class="brand-subtitle"></span>
                </div>
            </div>

            <!-- Report Title Section -->
            <div class="cover-title-section">
                <div class="cover-report-type">Certified Penetration Testing Specialist</div>
                <h1 class="cover-project-name">Exam Report</h1>
                    <img src="assets/htb-cpts-badge.png" alt="HTB CPTS certification badge" width="200" />
            </div>

            <!-- Report Metadata -->
            <div class="cover-metadata">
                <table class="cover-info-table">
                    <tr>
                        <td class="info-label">Organization:</td>
                        <td class="info-value">{{OrganizationName}}</td>
                    </tr>
                    <tr>
                        <td class="info-label">Ref:</td>
                        <td class="info-value">{{ReportReference}}</td>
                    </tr>
                    <tr>
                        <td class="info-label">Version:</td>
                        <td class="info-value">{{for doc in Documents}}{{if for.last}}{{doc.DocumentVersion}}{{end}}{{end}}</td>
                    </tr>
                    <tr>
                        <td class="info-label">Date:</td>
                        <td class="info-value">{{TodayLong}}</td>
                    </tr>
                    <tr>
                        <td class="info-label">Classification:</td>
                        <td class="info-value classification-badge">CONFIDENTIAL</td>
                    </tr>
                </table>
            </div>
        </div>

        <!-- Circuit pattern decoration (bottom) -->
        <div class="cover-decoration-bottom">
            <svg width="1500" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="neon-glow-bottom" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur5"/>
                        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur10"/>
                        <feMerge>
                            <feMergeNode in="blur10"/>
                            <feMergeNode in="blur5"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <g stroke="#A247DE" stroke-width="2" fill="none" stroke-linecap="square" filter="url(#neon-glow-bottom)">

                    <circle cx="20" cy="150" r="3" fill="#A247DE"/>
                    <circle cx="150" cy="20" r="3" fill="#A247DE"/>
                    <circle cx="220" cy="80" r="3" fill="#A247DE"/>
                    <circle cx="80" cy="220" r="3" fill="#A247DE"/>
                    <circle cx="180" cy="180" r="5" fill="#111927" stroke-width="2"/> <path d="M0,40 L60,40 L100,80 L180,80 L220,120 L220,250"/>

                    <path d="M60,40 L60,0"/>
                    <path d="M100,80 L100,120 L140,120 L180,160 L180,175"/>
                    <path d="M180,185 L180,220 L250,220"/>
                    <path d="M220,80 L280,80"/>
                    <path d="M220,120 L260,120 L260,100"/>
                    <path d="M80,220 L80,180 L40,180 L40,150 L23,150"/>
                    <path d="M150,23 L150,50 L120,80"/>

                    <rect x="250" y="40" width="10" height="10" stroke-width="1" fill="#111927"/>
                    <path d="M255,50 L255,70"/>
                    <path d="M250,45 L230,45"/>
                </g>
            </svg>
        </div>
    </div>
